<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Ganesh - Global Market</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #0b1a30; /* Dark blue background */
            color: #ffffff;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: linear-gradient(135deg, #0b1a30 0%, #1a365d 100%);
        }
        .container {
            max-width: 800px;
            padding: 40px 20px;
        }
        .logo {
            width: 200px; /* Logo size */
            height: auto;
            margin-bottom: 30px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); /* Gold glow */
        }
        .headline-top {
            font-size: 1.2em;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .headline-main {
            font-size: 3.5em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .sub-headline {
            font-size: 1.5em;
            color: #d4af37; /* Gold color */
            margin-bottom: 40px;
            font-weight: 500;
        }
        .brand-name {
            font-size: 3em;
            color: #d4af37; /* Gold color */
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .description {
            font-size: 1.3em;
            line-height: 1.6;
            color: #e0e0e0;
            max-width: 650px;
            margin: 0 auto;
            border-top: 1px solid #d4af37;
            border-bottom: 1px solid #d4af37;
            padding: 25px 0;
        }
        .footer-text {
            margin-top: 40px;
            font-size: 1em;
            color: #a0aec0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Mobile ke liye thoda adjust */
        @media (max-width: 600px) {
            .headline-main { font-size: 2.5em; }
            .brand-name { font-size: 2.2em; }
            .description { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Yaha aapka logo aayega -->
        <img src="image.png" alt="Jai Ganesh Logo" class="logo">

        <div class="headline-top">If you want to</div>
        <div class="headline-main">EARN DOLLARS</div>
        <div class="sub-headline">Then, You Are At The Right Place</div>

        <div class="brand-name">JAI GANESH</div>

        <div class="description">
            It's A GLOBAL MARKET From 150 Years<br>
            with LEGAL & CORPORATE PLATFORM
        </div>

        <div class="footer-text">
            LATHANSHA CAPITAL NISM
        </div>
    </div>
</body>
</html>
